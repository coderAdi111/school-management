<p>class-form works!</p>
<div class="container mt-4">
  <h2 class="mb-3">Add New Class</h2>
  <div class="card">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label class="form-label">Class Name</label>
          <input type="text" class="form-control" placeholder="Grade 10 - Section A">
        </div>
        <div class="mb-3">
          <label class="form-label">Grade</label>
          <input type="text" class="form-control" placeholder="10">
        </div>
        <div class="mb-3">
          <label class="form-label">Section</label>
          <input type="text" class="form-control" placeholder="A">
        </div>
        <div class="mb-3">
          <label class="form-label">Teacher Name</label>
          <input type="text" class="form-control" placeholder="Mrs. Smith">
        </div>
        <div class="mb-3">
          <label class="form-label">Capacity</label>
          <input type="number" class="form-control" value="30">
        </div>
        <button type="submit" class="btn btn-primary">Save Class</button>
      </form>
    </div>
  </div>
</div>
